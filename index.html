<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accordatore Chitarra</title>
<style>
  :root{--bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--muted:#8e8e93;--track:#e5e5ea;--neck:#8b5a2b;--fret:#d8d8d8;--str:#c9c9c9;--ok:#34c759}
  body[data-t="scuro"]{--bg:#1c1c1e;--card:#2c2c2e;--text:#fff;--muted:#98989d;--track:#3a3a3c;--neck:#4a3020;--fret:#8a8a8a;--str:#bdbdbd}
  body[data-t="verde"]{--bg:#d8f5dd;--card:#effcf1;--text:#0f4d1f;--muted:#3d8a52;--track:#b9e8c3;--neck:#2f6b3c;--fret:#c9efd2;--str:#effcf1}
  body[data-t="arancione"]{--bg:#ffe3c7;--card:#fff3e6;--text:#6b2e00;--muted:#c2671a;--track:#ffcc99;--neck:#c0601a;--fret:#ffe0c2;--str:#fff4ea}
  body[data-t="rosso"]{--bg:#ffd9d6;--card:#fff0ef;--text:#6e0f0a;--muted:#c2453d;--track:#ffbdb8;--neck:#a3281f;--fret:#ffd2cf;--str:#fff1f0}
  body[data-t="sole"]{--bg:#fff4cc;--card:#fffbea;--text:#5a3b00;--muted:#b07a12;--track:#ffe08a;--neck:#c07a2c;--fret:#ffe9b0;--str:#fff3d6}
  body[data-t="mare"]{--bg:#d9f0ff;--card:#f2faff;--text:#0a3d62;--muted:#3c7ab0;--track:#b6defa;--neck:#2e5f8a;--fret:#cfe9ff;--str:#e8f5ff}
  body[data-t="caramella"]{--bg:#ffe1ef;--card:#fff3f8;--text:#7a1f4b;--muted:#c2578a;--track:#ffc4de;--neck:#b04a7c;--fret:#ffd6e8;--str:#fff0f6}
  body[data-t="viola"]{--bg:#2a1a4a;--card:#3a2763;--text:#fff;--muted:#c3b1f0;--track:#4c3880;--neck:#5b3a8c;--fret:#bba6ee;--str:#e4dbff}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
       display:flex;flex-direction:column;align-items:center;transition:background .3s,color .3s;-webkit-font-smoothing:antialiased}
  .wrap{width:100%;max-width:480px;padding:6px 8px 4px}
  h1{font-size:1.75rem;font-weight:700;letter-spacing:-.02em;margin:2px 0 6px;text-align:center}
  .temi{display:flex;justify-content:center;gap:10px;margin-bottom:8px}
  .temi button{width:30px;height:30px;border-radius:50%;border:2px solid var(--track);cursor:pointer;padding:0}
  .temi button.on{outline:3px solid var(--ok);outline-offset:2px}
  .card{background:var(--card);border-radius:22px;padding:8px 10px;margin-bottom:8px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
  svg{display:block;width:100%;height:auto}
  #needle{transition:transform .15s ease-out}
  .nota{text-align:center;font-size:4.2rem;font-weight:700;letter-spacing:-.03em;line-height:1;margin-top:-6px}
  .hz{text-align:center;color:var(--muted);font-size:.95rem;margin-top:4px}
  .msg{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;font-size:1.05rem;font-weight:600;text-align:left}
  .msg svg{width:56px;flex:none}
  .corda{text-align:center;font-size:1.25rem;font-weight:600;margin:2px 0 8px}
  .corda b{color:var(--ok)}
  footer{color:var(--muted);font-size:.75rem;text-align:center;padding:4px 0 14px}
</style>
</head>
<body data-t="chiaro">
<div class="wrap">
  <h1>Accordatore Chitarra</h1>
  <div class="temi" id="temi"></div>

  <div class="card">
    <svg viewBox="0 0 300 175" id="gauge">
      <path id="arc" fill="none" stroke="var(--track)" stroke-width="10" stroke-linecap="round"/>
      <path id="zone" fill="none" stroke="var(--ok)" stroke-width="10" stroke-linecap="round"/>
      <g id="ticks"></g>
      <g id="needle"><line x1="150" y1="160" x2="150" y2="42" stroke-width="6" stroke-linecap="round" id="nl"/></g>
      <circle cx="150" cy="160" r="9" id="nc"/>
      <text x="22" y="172" font-size="13" fill="var(--muted)">♭</text>
      <text x="270" y="172" font-size="13" fill="var(--muted)">♯</text>
    </svg>
    <div class="nota" id="nota">--</div>
    <div class="hz" id="hz">&nbsp;</div>
    <div class="msg" id="msg">Avvio del microfono…</div>
  </div>

  <div class="card">
    <div class="corda" id="corda">Suona una corda</div>
    <svg viewBox="0 24 360 123" id="tastiera"></svg>
  </div>
</div>
<footer>Copyright © Ignazio Paolicelli</footer>

<script>
const NOMI=["Do","Do#","Re","Re#","Mi","Fa","Fa#","Sol","Sol#","La","La#","Si"];
// dalla 1ª alla 6ª corda
const CORDE=[{m:64,n:"Mi"},{m:59,n:"Si"},{m:55,n:"Sol"},{m:50,n:"Re"},{m:45,n:"La"},{m:40,n:"Mi"}];
const TEMI={chiaro:"#ffffff",scuro:"#2c2c2e",verde:"#34c759",arancione:"#ff9500",rosso:"#ff3b30",sole:"#ffd34d",mare:"#5ab4f0",caramella:"#ff8fc0",viola:"#7b5cd6"};
const $=id=>document.getElementById(id), NS="http://www.w3.org/2000/svg";
const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};

// Temi
function setTema(t){
  document.body.dataset.t=t;
  [...$('temi').children].forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  try{localStorage.setItem('tema',t)}catch(e){}
}
for(const t in TEMI){const b=document.createElement('button');b.dataset.t=t;b.title=t;b.style.background=TEMI[t];b.onclick=()=>setTema(t);$('temi').appendChild(b);}
let salvato="chiaro";try{salvato=localStorage.getItem('tema')||"chiaro"}catch(e){}
setTema(TEMI[salvato]?salvato:"chiaro");

// Indicatore
const CX=150,CY=160,R=130,P=a=>[CX+R*Math.sin(a*Math.PI/180),CY-R*Math.cos(a*Math.PI/180)];
const arcD=(a,b)=>{const p=P(a),q=P(b);return `M${p[0]},${p[1]} A${R},${R} 0 0 1 ${q[0]},${q[1]}`;};
$('arc').setAttribute('d',arcD(-60,60)); $('zone').setAttribute('d',arcD(-6,6));
for(let k=-50;k<=50;k+=10){
  const a=k/50*60*Math.PI/180, l=k==0?22:12, r1=R-14, r0=r1-l;
  $('ticks').appendChild(el('line',{x1:CX+r0*Math.sin(a),y1:CY-r0*Math.cos(a),x2:CX+r1*Math.sin(a),y2:CY-r1*Math.cos(a),
    stroke:k==0?'var(--text)':'var(--muted)','stroke-width':k==0?3:2,'stroke-linecap':'round'}));
}

// Tastiera
const T=$('tastiera'), Y=i=>28+i*23, LAB=[];
T.appendChild(el('rect',{x:78,y:25,width:278,height:121,rx:2,fill:'var(--neck)'}));
T.appendChild(el('rect',{x:74,y:25,width:8,height:121,rx:2,fill:'var(--fret)'}));
[140,196,247,292,333].forEach(x=>T.appendChild(el('rect',{x:x,y:25,width:3,height:121,fill:'var(--fret)',opacity:.8})));
[168,270].forEach(x=>T.appendChild(el('circle',{cx:x,cy:85,r:6,fill:'var(--fret)',opacity:.7})));
const STR=CORDE.map((c,i)=>{
  const s=el('line',{x1:76,y1:Y(i),x2:356,y2:Y(i),stroke:'var(--str)','stroke-width':1.2+i*.55,'stroke-linecap':'round'});
  T.appendChild(s);
  const t=el('text',{x:66,y:Y(i)+5,'text-anchor':'end','font-size':13,'font-weight':600,fill:'var(--muted)'});
  t.textContent=`${c.n} ${i+1}ª`; T.appendChild(t); LAB.push(t); return s;
});

// Disegnini della chiave
function chiave(versoEsterno){
  const f=versoEsterno?'':' transform="translate(56,0) scale(-1,1)"';
  return `<svg viewBox="0 0 56 56"><g${f}>
    <rect x="22" y="30" width="12" height="22" rx="3" fill="var(--neck)"/>
    <rect x="26" y="22" width="4" height="10" fill="var(--muted)"/>
    <ellipse cx="28" cy="18" rx="15" ry="7" fill="var(--muted)"/>
    <path d="M10,10 A20,12 0 0 1 46,10" fill="none" stroke="#ff9500" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M40,3 L48,10 L38,14 Z" fill="#ff9500"/></g></svg>`;
}

let freq=-1,smooth=-1,cents=0,silence=0;
function colore(){const a=Math.abs(cents);return freq<=0?'var(--muted)':a<5?'var(--ok)':a<15?'#ff9500':'#ff3b30';}
function update(f){
  let corda=-1;
  if(f<=0){freq=smooth=-1;cents=0;$('nota').textContent='--';$('hz').innerHTML='&nbsp;';$('msg').textContent='Suona una corda';}
  else{
    smooth=(smooth>0&&Math.abs(f-smooth)/smooth<.03)?smooth*.6+f*.4:f; freq=smooth;
    const n=12*Math.log2(freq/440)+69, nr=Math.round(n);
    cents=(n-nr)*100;
    $('nota').textContent=NOMI[((nr%12)+12)%12];
    $('hz').textContent=`${freq.toFixed(1)} Hz · ${cents>0?'+':''}${cents.toFixed(0)} cent`;
    let b=0;CORDE.forEach((c,i)=>{if(Math.abs(n-c.m)<Math.abs(n-CORDE[b].m))b=i});
    if(Math.abs(n-CORDE[b].m)<2.5)corda=b;
    // intonazione rispetto alla corda (se riconosciuta), altrimenti alla nota più vicina
    const rif=corda>=0?(n-CORDE[corda].m)*100:cents;
    if(Math.abs(rif)<5)$('msg').innerHTML='<span style="color:var(--ok)">✓ Accordata!</span>';
    else if(rif<0)$('msg').innerHTML=chiave(true)+'<span>Troppo bassa:<br>ruota la chiave verso l\'esterno</span>';
    else $('msg').innerHTML=chiave(false)+'<span>Troppo alta:<br>ruota la chiave verso di te</span>';
    if(corda>=0)cents=Math.max(-50,Math.min(50,rif));
  }
  const c=colore();
  $('needle').setAttribute('transform',`rotate(${Math.max(-50,Math.min(50,cents))/50*60} ${CX} ${CY})`);
  $('nl').setAttribute('stroke',c);$('nc').setAttribute('fill',c);$('nota').style.color=c;
  STR.forEach((s,i)=>{
    const on=i===corda;
    s.setAttribute('stroke',on?'var(--ok)':'var(--str)');
    s.style.filter=on?'drop-shadow(0 0 4px #34c759)':'none';
    LAB[i].setAttribute('fill',on?'var(--ok)':'var(--muted)');
  });
  $('corda').innerHTML=corda>=0?`<b>${CORDE[corda].n}</b> – ${corda+1}ª corda`:'Suona una corda';
}

// Rilevamento della frequenza (YIN)
function yin(x,sr){
  const minL=Math.floor(sr/1200),maxL=Math.floor(sr/60),w=x.length-maxL,d=new Float32Array(maxL+1);
  for(let t=1;t<=maxL;t++){let s=0;for(let i=0;i<w;i++){const v=x[i]-x[i+t];s+=v*v;}d[t]=s;}
  let run=0;d[0]=1;
  for(let t=1;t<=maxL;t++){run+=d[t];d[t]=run?d[t]*t/run:1;}
  let tau=-1;
  for(let t=minL;t<maxL;t++){if(d[t]<.12){while(t+1<maxL&&d[t+1]<d[t])t++;tau=t;break;}}
  if(tau<0)return -1;
  const A=d[tau-1],B=d[tau],C=d[tau+1],den=A-2*B+C;
  return sr/(tau+(den?.5*(A-C)/den:0));
}

// Microfono: parte da solo
let ac=null;
async function avvia(){
  if(ac)return;
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    ac=new (window.AudioContext||window.webkitAudioContext)();
    const an=ac.createAnalyser();an.fftSize=4096;
    ac.createMediaStreamSource(s).connect(an);
    const buf=new Float32Array(an.fftSize);
    $('msg').textContent=ac.state==='suspended'?'Tocca lo schermo per iniziare':'Suona una corda';
    (function loop(){
      if(ac.state==='running'){
        an.getFloatTimeDomainData(buf);
        let sum=0;for(const v of buf)sum+=v*v;
        const f=Math.sqrt(sum/buf.length)>.008?yin(buf,ac.sampleRate):-1;
        if(f>0){silence=0;update(f);}else if(++silence===15)update(-1);
      }
      setTimeout(loop,90);
    })();
  }catch(e){ac=null;$('msg').textContent='Consenti l\'uso del microfono per accordare';}
}
addEventListener('pointerdown',()=>{if(ac&&ac.state==='suspended')ac.resume().then(()=>update(-1));else avvia();});
update(-1); avvia();
</script>
</body>
</html>
